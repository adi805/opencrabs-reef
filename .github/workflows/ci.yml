name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required: typecheck, production build, and the contracts the town promises.
  # These are the checks that must pass for a merge, and none of them need a
  # browser download or an external repository.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Poller privacy (nothing raw leaves, the source is never written) and the
      # live bridge contract (loopback-only bind, security headers, no CORS).
      - run: npm run test:contracts
      # The town must recognise the tools this runtime actually calls. Runs off
      # the checked-in sample, so no database is required.
      - run: npm run verify:map

  # Advisory: the browser checks. They need a Playwright download and a software
  # renderer, so they report but do not block a merge.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Writes docs/evidence/m2-reef.png: the visual witness for the theme.
      - run: npm run verify:textures
      - run: npm run verify:characters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reef-evidence
          path: docs/evidence/
          if-no-files-found: ignore
